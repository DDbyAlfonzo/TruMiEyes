<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231F20">
<title>You're offline | TruMiEyes</title>
<style>
  html,body{margin:0;height:100%;background:#231F20;color:#F4F2EE;font-family:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;text-align:center;box-sizing:border-box}
  img{width:140px;height:auto}
  h1{margin:16px 0 0;font-weight:200;font-size:40px;line-height:1.05}
  p{margin:0;max-width:340px;line-height:1.6;color:rgba(244,242,238,.78)}
  button{margin-top:12px;height:48px;padding:0 28px;border-radius:999px;border:0;background:#fff;color:#231F20;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/brand/logo-stacked-white.svg" alt="TruMiEyes">
  <h1>You're offline</h1>
  <p>Photos you've already viewed are saved on this device. Reconnect to see the rest of your gallery and send your selection.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
